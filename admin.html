<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00f0ff" />
  <meta name="robots" content="noindex, nofollow" />
  <title>vulsanX — Superadmin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏸</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & ROOT ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #00f0ff;
      --green: #39ff9a;
      --purple: #b300ff;
      --red: #ff2d55;
      --orange: #ff8800;
      --bg: #0a0f1a;
      --surface: #111b2b;
      --border: rgba(0, 240, 255, 0.15);
      --glass: rgba(10, 20, 40, 0.75);
      --text: #d0ecff;
      --dim: rgba(180, 220, 255, 0.5);
      --shadow: 0 8px 32px rgba(0,0,0,0.8);
      --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,240,255,0.03) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(179,0,255,0.04) 0%, transparent 50%),
        repeating-linear-gradient(45deg, rgba(0,240,255,0.01) 0px, rgba(0,240,255,0.01) 2px, transparent 2px, transparent 8px);
    }

    /* ===== MATRIX CANVAS ===== */
    #matrix-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.06;
      pointer-events: none;
    }

    /* ===== APP WRAPPER ===== */
    #app {
      position: relative;
      z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 20px 40px;
      min-height: 100vh;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      gap: 12px;
    }
    .brand {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(20px, 3.5vw, 34px);
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--cyan), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand .shuttle { -webkit-text-fill-color: initial; color: #fff; filter: drop-shadow(0 0 8px var(--cyan)); }
    .brand small {
      font-size: 0.4em;
      font-weight: 400;
      letter-spacing: 4px;
      -webkit-text-fill-color: var(--dim);
      background: none;
      display: block;
      margin-top: 2px;
    }
    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* ===== BUTTONS ===== */
    .btn {
      padding: 6px 18px;
      border-radius: 30px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-decoration: none;
      display: inline-block;
      text-align: center;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--cyan); background: rgba(0,240,255,0.06); }
    .btn.primary { background: var(--cyan); color: #0a0f1a; border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,240,255,0.2); }
    .btn.primary:hover { filter: brightness(1.1); transform: scale(1.03); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: rgba(255,45,85,0.12); border-color: var(--red); }
    .btn.success { border-color: var(--green); color: var(--green); }
    .btn.success:hover { background: rgba(57,255,154,0.08); }
    .btn.small { padding: 4px 14px; font-size: 9px; }
    .btn.xsmall { padding: 2px 10px; font-size: 8px; }
    .btn.ghost { border-color: var(--dim); color: var(--dim); }
    .btn.ghost:hover { border-color: var(--cyan); color: var(--cyan); }
    .btn.file-btn { position: relative; overflow: hidden; }
    .btn.file-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== AUTH BOX ===== */
    .auth-box {
      max-width: 420px;
      margin: 60px auto;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: var(--shadow);
    }
    .auth-box h2 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--cyan);
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .auth-box .sub {
      text-align: center;
      color: var(--dim);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .auth-box form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth-box input[type="password"] {
      background: rgba(0,20,40,0.7);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      outline: none;
      width: 100%;
      transition: 0.2s;
    }
    .auth-box input[type="password"]:focus {
      border-color: var(--cyan);
      box-shadow: var(--glow-cyan);
    }
    .auth-box .btn {
      padding: 12px;
      font-size: 13px;
      width: 100%;
      text-align: center;
    }
    .auth-box .err {
      color: var(--red);
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      min-height: 20px;
    }
    .auth-box .muted {
      color: var(--dim);
      font-size: 12px;
      text-align: center;
      margin-top: 16px;
    }
    .auth-box .muted a {
      color: var(--cyan);
      text-decoration: none;
    }
    .auth-box .muted a:hover { text-decoration: underline; }

    /* ===== LAYOUT ===== */
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      height: fit-content;
    }
    .sidebar h3 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .trn-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }
    .trn-list li {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }
    .trn-list li:hover { background: rgba(0,240,255,0.04); border-color: var(--border); }
    .trn-list li.active {
      background: rgba(0,240,255,0.08);
      border-color: var(--cyan);
    }
    .trn-list .trn-name { font-weight: 600; font-size: 14px; }
    .trn-list .badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(0,240,255,0.08);
      color: var(--dim);
      border: 1px solid var(--border);
    }
    .trn-list .badge.setup { border-color: var(--dim); color: var(--dim); }
    .trn-list .badge.ongoing { border-color: var(--green); color: var(--green); background: rgba(57,255,154,0.08); }
    .trn-list .badge.completed { border-color: var(--cyan); color: var(--cyan); background: rgba(0,240,255,0.08); }

    /* ===== SIDEBAR FORM ===== */
    .sidebar .stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .sidebar .stack input {
      background: rgba(0,20,40,0.7);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    .sidebar .stack input:focus { border-color: var(--cyan); }
    .sidebar .stack .btn { width: 100%; text-align: center; }

    /* ===== CONTENT ===== */
    .content {
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .content .muted { color: var(--dim); text-align: center; padding: 40px 0; }

    /* ===== TOURNAMENT PANEL ===== */
    .trn-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .trn-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: clamp(18px, 2.5vw, 28px);
      color: var(--cyan);
      text-shadow: 0 0 30px rgba(0,240,255,0.15);
    }
    .trn-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .trn-meta .badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(0,240,255,0.06);
      border: 1px solid var(--border);
      color: var(--dim);
    }
    .trn-meta .badge.setup { border-color: var(--dim); color: var(--dim); }
    .trn-meta .badge.ongoing { border-color: var(--green); color: var(--green); background: rgba(57,255,154,0.06); }
    .trn-meta .badge.completed { border-color: var(--cyan); color: var(--cyan); background: rgba(0,240,255,0.06); }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 16px;
    }

    .card {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .card h3 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .team-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px 0;
      max-height: 300px;
      overflow-y: auto;
    }
    .team-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(0,240,255,0.04);
      gap: 8px;
    }
    .team-list li:last-child { border: none; }
    .team-list li strong { color: var(--cyan); font-size: 14px; }
    .team-list .team-stats {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--dim);
    }
    .team-list .muted { color: var(--dim); font-size: 13px; }

    .card .stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card .stack input {
      background: rgba(0,20,40,0.7);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      outline: none;
    }
    .card .stack input:focus { border-color: var(--cyan); }
    .card .stack .btn { align-self: flex-start; }

    .card .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .champion-banner {
      background: linear-gradient(135deg, rgba(255,215,0,0.12), rgba(255,215,0,0.04));
      border: 1px solid #ffd700;
      border-radius: 12px;
      padding: 14px 20px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.3);
      margin-bottom: 16px;
    }

    .leaderboard {
      list-style: none;
      padding: 0;
    }
    .leaderboard li {
      display: flex;
      justify-content: space-between;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(0,240,255,0.04);
      font-size: 14px;
    }
    .leaderboard li:last-child { border: none; }
    .leaderboard li span:first-child { font-weight: 600; }
    .leaderboard li span:last-child { color: var(--dim); font-family: 'Share Tech Mono', monospace; }

    /* ===== BRACKET ===== */
    .bracket {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 8px 0;
    }
    .round {
      flex: 1;
      min-width: 150px;
    }
    .round h4 {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .match {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
    }
    .match-row {
      padding: 3px 0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 4px;
      padding: 4px 8px;
      transition: 0.15s;
    }
    .match-row.clickable:hover {
      background: rgba(0,240,255,0.08);
      border-color: var(--cyan);
    }
    .match-row.winner {
      color: var(--green);
      font-weight: 700;
    }
    .match-row.winner::before { content: '🏆 '; }
    .match-row.loser { color: var(--dim); }
    .match-row.muted { color: var(--dim); font-style: italic; font-size: 12px; cursor: default; }
    .match-row small { color: var(--dim); font-size: 9px; }
    .match .btn.xsmall { margin-top: 4px; }

    /* ===== ERRORS ===== */
    .err.center {
      text-align: center;
      color: var(--red);
      font-size: 13px;
      margin-top: 12px;
      min-height: 20px;
    }

    /* ===== LOADING ===== */
    .loading {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      color: var(--dim);
      padding: 60px 0;
      letter-spacing: 4px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .top-actions { width: 100%; justify-content: flex-start; }
      .trn-header { flex-direction: column; align-items: flex-start; }
      .bracket { flex-direction: column; }
      .round { min-width: 100%; }
      .auth-box { padding: 24px 20px; margin: 30px 12px; }
    }
    @media (max-width: 420px) {
      #app { padding: 10px 12px 30px; }
      .content { padding: 16px; }
      .sidebar { padding: 14px; }
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <div id="app">
    <p class="loading">⏳ Memuatkan...</p>
  </div>

  <script>
    // ===== MATRIX RAIN =====
    (function() {
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()[]{}|<>/\\~`';
      let cols, drops;
      const fontSize = 13;
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        cols = Math.floor(canvas.width / fontSize);
        drops = Array(cols).fill(1);
      }
      function draw() {
        ctx.fillStyle = 'rgba(10,15,26,0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00f0ff';
        ctx.font = fontSize + 'px "Share Tech Mono", monospace';
        for (let i = 0; i < drops.length; i++) {
          ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
      }
      resize();
      window.addEventListener('resize', resize);
      setInterval(draw, 50);
    })();
  </script>

  <script>
    // ===== FIXED ADMIN.JS — with dynamic player count =====
    const ADMIN_HASH_KEY = 'vulsanx_admin_hash';
    const ADMIN_SESSION_KEY = 'vulsanx_admin_logged_in';

    let data = null;
    let selectedTournamentId = null;
    const root = document.getElementById('app');

    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    async function init() {
      data = await bootstrapData();
      if (!localStorage.getItem(ADMIN_HASH_KEY)) {
        renderSetPassword();
      } else if (sessionStorage.getItem(ADMIN_SESSION_KEY) === '1') {
        selectedTournamentId = data.activeTournamentId;
        renderDashboard();
      } else {
        renderLogin();
      }
    }

    function renderSetPassword() {
      root.innerHTML = `
        <div class="auth-box">
          <h2>🔐 Setup vulsanX</h2>
          <p class="sub">Superadmin — first time setup</p>
          <form id="setPassForm">
            <input type="password" id="newPass" placeholder="New password" minlength="4" required autofocus />
            <input type="password" id="confirmPass" placeholder="Confirm password" minlength="4" required />
            <button type="submit" class="btn primary">Set Password & Login</button>
          </form>
          <p class="err" id="errMsg"></p>
        </div>`;
      document.getElementById('setPassForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('newPass').value;
        const p2 = document.getElementById('confirmPass').value;
        if (p1 !== p2) {
          document.getElementById('errMsg').textContent = 'Passwords do not match.';
          return;
        }
        localStorage.setItem(ADMIN_HASH_KEY, await sha256(p1));
        sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
        selectedTournamentId = data.activeTournamentId;
        renderDashboard();
      });
    }

    function renderLogin() {
      root.innerHTML = `
        <div class="auth-box">
          <h2>🔐 Login</h2>
          <p class="sub">vulsanX Superadmin</p>
          <form id="loginForm">
            <input type="password" id="password" placeholder="Password" required autofocus />
            <button type="submit" class="btn primary">Login</button>
          </form>
          <p class="err" id="errMsg"></p>
          <p class="muted"><a href="index.html">← Back to public view</a></p>
        </div>`;
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pass = document.getElementById('password').value;
        const hash = await sha256(pass);
        if (hash === localStorage.getItem(ADMIN_HASH_KEY)) {
          sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
          selectedTournamentId = data.activeTournamentId;
          renderDashboard();
        } else {
          document.getElementById('errMsg').textContent = 'Incorrect password.';
        }
      });
    }

    function logout() {
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
      renderLogin();
    }

    function statusLabel(s) {
      return { setup: 'Setup', ongoing: 'Ongoing', completed: 'Completed' }[s] || s;
    }

    function teamName(t, teamId) {
      if (!teamId) return '-';
      const team = t.teams.find(x => x.id === teamId);
      return team ? team.name : '?';
    }

    function renderDashboard() {
      const tournament = selectedTournamentId ? getTournament(data, selectedTournamentId) : null;

      root.innerHTML = `
        <header class="topbar">
          <div class="brand"><span class="shuttle">🏸</span> vulsanX <small>Superadmin</small></div>
          <div class="top-actions">
            <a href="index.html" class="btn small ghost">Public View</a>
            <button id="exportBtn" class="btn small success">Export</button>
            <label class="btn small file-btn">Import
              <input type="file" id="importInput" accept=".json" hidden />
            </label>
            <button id="logoutBtn" class="btn small danger">Logout</button>
          </div>
        </header>

        <main class="layout">
          <aside class="sidebar">
            <h3>🏆 Tournaments</h3>
            <ul class="trn-list">
              ${data.tournaments.map(t => `
                <li class="${t.id === selectedTournamentId ? 'active' : ''}" data-id="${t.id}">
                  <span class="trn-name">${esc(t.name)}</span>
                  <span class="badge ${t.status}">${statusLabel(t.status)}</span>
                </li>`).join('') || '<li class="muted">No tournaments yet.</li>'}
            </ul>

            <h3>➕ Create New</h3>
            <form id="newTrnForm" class="stack">
              <input type="text" id="trnName" placeholder="Tournament name" required />
              <button type="submit" class="btn primary">+ Create Tournament</button>
            </form>
          </aside>

          <section class="content">
            ${tournament ? renderTournamentPanel(tournament) : '<p class="muted">Select or create a tournament on the left.</p>'}
          </section>
        </main>
        <p class="err center" id="errMsg"></p>
      `;

      bindDashboardEvents(tournament);
    }

    function renderTournamentPanel(t) {
      return `
        <div class="trn-header">
          <h2>${esc(t.name)}</h2>
          <div class="trn-meta">
            <span class="badge ${t.status}">${statusLabel(t.status)}</span>
            <button class="btn small danger" id="deleteTrnBtn" data-id="${t.id}">Delete</button>
          </div>
        </div>

        ${t.status === 'completed' && t.champion ? `
          <div class="champion-banner">🏆 Champion: ${esc(teamName(t, t.champion))}</div>` : ''}

        <div class="grid-2">
          <div class="card">
            <h3>Teams (${t.teams.length})</h3>
            <ul class="team-list">
              ${t.teams.map(team => `
                <li>
                  <strong>${esc(team.name)}</strong>
                  <div class="team-stats">${team.wins}W - ${team.losses}L</div>
                  ${t.status === 'setup' ? `<button class="btn xsmall danger" data-remove-team="${team.id}">✕</button>` : ''}
                </li>`).join('') || '<li class="muted">No teams yet.</li>'}
            </ul>

            ${t.status === 'setup' ? `
              <form id="addTeamForm" class="stack">
                <input type="text" id="teamName" placeholder="Team name" required />
                <button type="submit" class="btn primary small">+ Add Team</button>
              </form>
              <div class="actions">
                <button id="genBracketBtn" class="btn success" ${t.teams.length < 2 ? 'disabled' : ''}>
                  ⚡ Generate Bracket (${t.teams.length} team)
                </button>
              </div>
            ` : `
              <div class="actions">
                <button id="resetTrnBtn" class="btn danger small">⟳ Delete Bracket & Restart</button>
              </div>
            `}
          </div>

          <div class="card">
            <h3>Leaderboard</h3>
            <ol class="leaderboard">
              ${getLeaderboard(t).map(team => `<li><span>${esc(team.name)}</span><span>${team.wins}W ${team.losses}L</span></li>`).join('') || '<li class="muted">No data.</li>'}
            </ol>
          </div>
        </div>

        ${t.bracket ? `<div class="card"><h3>Bracket</h3>${renderBracket(t)}</div>` : ''}
      `;
    }

    function renderBracket(t) {
      const totalRounds = t.bracket.rounds.length;
      return `<div class="bracket">
        ${t.bracket.rounds.map((round, rIdx) => `
          <div class="round">
            <h4>${roundLabel(rIdx, totalRounds)}</h4>
            ${round.matches.map((m, mIdx) => renderMatchAdmin(t, m, rIdx, mIdx)).join('')}
          </div>`).join('')}
      </div>`;
    }

    function renderMatchAdmin(t, m, rIdx, mIdx) {
      const aName = teamName(t, m.teamA);
      const bName = teamName(t, m.teamB);
      let body = '';
      if (m.status === 'bye') {
        body = `<div class="match-row winner">${esc(m.teamA ? aName : bName)} <small>(bye)</small></div>`;
      } else if (m.status === 'pending') {
        body = `<div class="match-row muted">Waiting for previous round...</div>`;
      } else if (m.status === 'ready') {
        body = `
          <div class="match-row clickable" data-pick="${rIdx}:${mIdx}:${m.teamA}">${esc(aName)}</div>
          <div class="match-row clickable" data-pick="${rIdx}:${mIdx}:${m.teamB}">${esc(bName)}</div>`;
      } else if (m.status === 'done') {
        body = `
          <div class="match-row ${m.winner === m.teamA ? 'winner' : 'loser'}">${esc(aName)}</div>
          <div class="match-row ${m.winner === m.teamB ? 'winner' : 'loser'}">${esc(bName)}</div>
          <button class="btn xsmall ghost" data-reset="${rIdx}:${mIdx}">↺ Reset</button>`;
      }
      return `<div class="match">${body}</div>`;
    }

    function bindDashboardEvents(tournament) {
      // Export
      document.getElementById('exportBtn').addEventListener('click', () => exportData(data));

      // Import
      document.getElementById('importInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        importData(file, (err, newData) => {
          if (err) { alert('Invalid file.'); return; }
          data = newData;
          selectedTournamentId = data.activeTournamentId;
          renderDashboard();
        });
      });

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', logout);

      // Tournament selection
      document.querySelectorAll('.trn-list li[data-id]').forEach(li => {
        li.addEventListener('click', () => {
          selectedTournamentId = li.dataset.id;
          data.activeTournamentId = selectedTournamentId;
          saveData(data);
          renderDashboard();
        });
      });

      // Create tournament
      document.getElementById('newTrnForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('trnName').value;
        if (!name.trim()) return;
        const t = createTournament(data, name.trim());
        selectedTournamentId = t.id;
        data.activeTournamentId = t.id;
        saveData(data);
        renderDashboard();
      });

      // Delete tournament
      const deleteTrnBtn = document.getElementById('deleteTrnBtn');
      if (deleteTrnBtn) deleteTrnBtn.addEventListener('click', () => {
        if (!confirm('Delete this tournament? This cannot be undone.')) return;
        deleteTournament(data, deleteTrnBtn.dataset.id);
        selectedTournamentId = data.activeTournamentId;
        renderDashboard();
      });

      // Add team
      const addTeamForm = document.getElementById('addTeamForm');
      if (addTeamForm) addTeamForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const t = getTournament(data, selectedTournamentId);
        const name = document.getElementById('teamName').value;
        addTeam(t, name);
        saveData(data);
        renderDashboard();
      });

      // Remove team
      document.querySelectorAll('[data-remove-team]').forEach(btn => {
        btn.addEventListener('click', () => {
          const t = getTournament(data, selectedTournamentId);
          removeTeam(t, btn.dataset.removeTeam);
          saveData(data);
          renderDashboard();
        });
      });

      // Generate bracket
      const genBtn = document.getElementById('genBracketBtn');
      if (genBtn) genBtn.addEventListener('click', () => {
        const t = getTournament(data, selectedTournamentId);
        try {
          generateBracket(t);
          saveData(data);
          renderDashboard();
        } catch (err) {
          document.getElementById('errMsg').textContent = err.message;
        }
      });

      // Reset tournament
      const resetTrnBtn = document.getElementById('resetTrnBtn');
      if (resetTrnBtn) resetTrnBtn.addEventListener('click', () => {
        if (!confirm('Delete bracket and restart? All match results will be lost.')) return;
        const t = getTournament(data, selectedTournamentId);
        t.bracket = null;
        t.status = 'setup';
        t.champion = null;
        t.teams.forEach(team => { team.wins = 0; team.losses = 0; });
        saveData(data);
        renderDashboard();
      });

      // Pick winner
      document.querySelectorAll('[data-pick]').forEach(el => {
        el.addEventListener('click', () => {
          const [rIdx, mIdx, teamId] = el.dataset.pick.split(':');
          const t = getTournament(data, selectedTournamentId);
          try {
            setMatchWinner(t, Number(rIdx), Number(mIdx), teamId);
            saveData(data);
            renderDashboard();
          } catch (err) {
            document.getElementById('errMsg').textContent = err.message;
          }
        });
      });

      // Reset match
      document.querySelectorAll('[data-reset]').forEach(el => {
        el.addEventListener('click', () => {
          if (!confirm('Reset this match? Later rounds will also be cleared.')) return;
          const [rIdx, mIdx] = el.dataset.reset.split(':');
          const t = getTournament(data, selectedTournamentId);
          clearMatchForward(t, Number(rIdx), Number(mIdx));
          saveData(data);
          renderDashboard();
        });
      });
    }

    // ===== DATA FUNCTIONS (from data.js) =====
    function getTournament(data, id) {
      return data.tournaments.find(t => t.id === id) || null;
    }

    function createTournament(data, name) {
      const t = {
        id: 'trn_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4),
        name: name.trim(),
        status: 'setup',
        createdAt: Date.now(),
        teams: [],
        bracket: null,
        champion: null
      };
      data.tournaments.push(t);
      if (!data.activeTournamentId) data.activeTournamentId = t.id;
      saveData(data);
      return t;
    }

    function deleteTournament(data, tournamentId) {
      data.tournaments = data.tournaments.filter(t => t.id !== tournamentId);
      if (data.activeTournamentId === tournamentId) {
        data.activeTournamentId = data.tournaments.length ? data.tournaments[0].id : null;
      }
      delete data.claims[tournamentId];
      saveData(data);
    }

    function addTeam(tournament, name) {
      const team = {
        id: 'team_' + Math.random().toString(36).slice(2, 9),
        name: name.trim(),
        wins: 0,
        losses: 0
      };
      tournament.teams.push(team);
      return team;
    }

    function removeTeam(tournament, teamId) {
      tournament.teams = tournament.teams.filter(t => t.id !== teamId);
    }

    function getLeaderboard(tournament) {
      return tournament.teams.slice().sort((a, b) => {
        if (b.wins !== a.wins) return b.wins - a.wins;
        return a.losses - b.losses;
      });
    }

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function nextPowerOf2(n) {
      let p = 1;
      while (p < n) p *= 2;
      return p;
    }

    function makeMatch(teamA, teamB) {
      let status, winner = null;
      if (teamA && teamB) status = 'ready';
      else if (teamA || teamB) { status = 'bye'; winner = teamA || teamB; }
      else status = 'pending';
      return { id: 'm_' + Math.random().toString(36).slice(2, 9), teamA, teamB, winner, status };
    }

    function generateBracket(tournament) {
      const teamIds = tournament.teams.map(t => t.id);
      if (teamIds.length < 2) throw new Error('Perlukan sekurang-kurangnya 2 team untuk generate bracket.');

      const shuffled = shuffleArray(teamIds);
      const n = shuffled.length;
      const size = nextPowerOf2(n);
      const matchCount = size / 2;
      const byesNeeded = size - n;
      const fullMatches = matchCount - byesNeeded;

      const round1 = [];
      let idx = 0;
      for (let i = 0; i < fullMatches; i++) {
        round1.push(makeMatch(shuffled[idx], shuffled[idx + 1]));
        idx += 2;
      }
      for (let i = 0; i < byesNeeded; i++) {
        round1.push(makeMatch(shuffled[idx], null));
        idx += 1;
      }

      const rounds = [{ roundNumber: 1, matches: round1 }];
      let prevCount = round1.length;
      let roundNumber = 2;
      while (prevCount > 1) {
        const matches = [];
        for (let i = 0; i < prevCount / 2; i++) matches.push(makeMatch(null, null));
        rounds.push({ roundNumber, matches });
        prevCount = matches.length;
        roundNumber++;
      }

      tournament.bracket = { size, rounds };
      tournament.status = 'ongoing';
      tournament.champion = null;

      rounds[0].matches.forEach((m, i) => {
        if (m.winner) propagateToNextRound(tournament, 0, i, m.winner);
      });

      return tournament.bracket;
    }

    function propagateToNextRound(tournament, roundIndex, matchIndex, winnerId) {
      const rounds = tournament.bracket.rounds;
      const nextRoundIndex = roundIndex + 1;
      if (nextRoundIndex >= rounds.length) return;
      const nextMatch = rounds[nextRoundIndex].matches[Math.floor(matchIndex / 2)];
      if (matchIndex % 2 === 0) nextMatch.teamA = winnerId;
      else nextMatch.teamB = winnerId;

      if (nextMatch.teamA && nextMatch.teamB) {
        nextMatch.status = 'ready';
      } else if (nextMatch.teamA || nextMatch.teamB) {
        nextMatch.status = 'pending';
      }
    }

    function setMatchWinner(tournament, roundIndex, matchIndex, winnerId) {
      const match = tournament.bracket.rounds[roundIndex].matches[matchIndex];
      if (!match.teamA || !match.teamB) throw new Error('Match not ready yet.');
      if (winnerId !== match.teamA && winnerId !== match.teamB) throw new Error('Invalid team.');

      match.winner = winnerId;
      match.status = 'done';
      const winner = tournament.teams.find(t => t.id === winnerId);
      const loserId = match.teamA === winnerId ? match.teamB : match.teamA;
      const loser = tournament.teams.find(t => t.id === loserId);
      if (winner) winner.wins += 1;
      if (loser) loser.losses += 1;
      propagateToNextRound(tournament, roundIndex, matchIndex, winnerId);

      if (roundIndex === tournament.bracket.rounds.length - 1) {
        tournament.status = 'completed';
        tournament.champion = winnerId;
      }
    }

    function clearMatchForward(tournament, roundIndex, matchIndex) {
      const rounds = tournament.bracket.rounds;
      const match = rounds[roundIndex].matches[matchIndex];

      if (match.winner) {
        const winner = tournament.teams.find(t => t.id === match.winner);
        const loserId = match.teamA === match.winner ? match.teamB : match.teamA;
        const loser = tournament.teams.find(t => t.id === loserId);
        if (winner) winner.wins -= 1;
        if (loser) loser.losses -= 1;
      }

      const nextRoundIndex = roundIndex + 1;
      if (nextRoundIndex < rounds.length) {
        const nextMatchIndex = Math.floor(matchIndex / 2);
        clearMatchForward(tournament, nextRoundIndex, nextMatchIndex);
        const nextMatch = rounds[nextRoundIndex].matches[nextMatchIndex];
        if (matchIndex % 2 === 0) nextMatch.teamA = null;
        else nextMatch.teamB = null;
        nextMatch.status = 'pending';
      }

      if (match.status !== 'bye') {
        match.winner = null;
        match.status = (match.teamA && match.teamB) ? 'ready' : 'pending';
      }

      tournament.status = 'ongoing';
      tournament.champion = null;
    }

    function roundLabel(roundIndex, totalRounds) {
      const fromEnd = totalRounds - roundIndex;
      if (fromEnd === 1) return 'Final';
      if (fromEnd === 2) return 'Semifinal';
      if (fromEnd === 3) return 'Quarterfinal';
      return 'Round ' + (roundIndex + 1);
    }

    function saveData(data) {
      localStorage.setItem('vulsanx_data_v1', JSON.stringify(data));
    }

    async function bootstrapData() {
      const existing = localStorage.getItem('vulsanx_data_v1');
      if (existing) return JSON.parse(existing);
      try {
        const res = await fetch('data.json', { cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          const merged = { tournaments: json.tournaments || [], activeTournamentId: json.activeTournamentId || null, claims: {} };
          localStorage.setItem('vulsanx_data_v1', JSON.stringify(merged));
          return merged;
        }
      } catch (e) {}
      const fresh = { tournaments: [], activeTournamentId: null, claims: {} };
      localStorage.setItem('vulsanx_data_v1', JSON.stringify(fresh));
      return fresh;
    }

    function exportData(data) {
      const exportObj = { tournaments: data.tournaments, activeTournamentId: data.activeTournamentId };
      const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importData(file, onDone) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const json = JSON.parse(reader.result);
          const data = JSON.parse(localStorage.getItem('vulsanx_data_v1') || '{"tournaments":[],"activeTournamentId":null,"claims":{}}');
          data.tournaments = json.tournaments || [];
          data.activeTournamentId = json.activeTournamentId || (data.tournaments[0] && data.tournaments[0].id) || null;
          saveData(data);
          onDone(null, data);
        } catch (e) {
          onDone(e);
        }
      };
      reader.readAsText(file);
    }

    init();
  </script>
</body>
</html>
