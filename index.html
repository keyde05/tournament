<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090c11" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>vulsanX // CYBER SMASH TOURNAMENT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏸</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #090c11;
      --surface: #11161f;
      --surface-soft: #131a24;
      --surface-strong: #1c2431;
      --text: #f4f5ef;
      --muted: #9aa2a9;
      --border: rgba(255,255,255,0.12);
      --rule: rgba(255,255,255,0.08);
      --rule-strong: rgba(255,255,255,0.16);
      --lime: #C8FF00;
      --green: #00A86B;
      --red: #E8002D;
      --ink: #e6e7dd;
      --paper: #171f29;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* ===== TICKER STRIP ===== */
    .ticker {
      background: var(--surface);
      color: var(--lime);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      padding: 6px 0;
      overflow: hidden;
      white-space: nowrap;
    }
    .ticker-inner {
      display: inline-block;
      animation: tick 30s linear infinite;
    }
    .ticker-inner span { margin: 0 40px; }
    @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ===== APP WRAPPER ===== */
    #app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ===== HEADER ===== */
    .topbar {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      padding: 0;
      border-bottom: 3px solid var(--border);
      margin-bottom: 0;
    }
    .brand-block {
      padding: 18px 0 14px;
      flex: 1;
    }
    .brand-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .brand-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(42px, 7vw, 72px);
      letter-spacing: 2px;
      line-height: 0.95;
      color: var(--text);
    }
    .brand-name .accent { color: var(--lime); -webkit-text-stroke: 1px var(--bg); }
    .top-actions {
      display: flex;
      align-items: center;
      padding: 0 0 0 24px;
      border-left: 1px solid var(--border);
    }

    /* ===== BUTTONS ===== */
    .btn {
      padding: 8px 18px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      border-radius: 0;
    }
    .btn:hover { background: var(--text); color: var(--bg); }
    .btn.primary { background: var(--lime); border-color: var(--lime); color: var(--bg); font-weight: 700; }
    .btn.primary:hover { background: var(--text); color: var(--lime); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: var(--text); }
    .btn.ghost { border-color: var(--border); color: var(--muted); }
    .btn.ghost:hover { border-color: var(--text); color: var(--text); background: transparent; }
    .btn.small { padding: 5px 14px; font-size: 10px; }
    .btn.xsmall { padding: 4px 10px; font-size: 9px; }

    /* ===== TOURNAMENT SELECT ===== */
    .trn-select-wrap { padding: 16px 0; border-bottom: 1px solid var(--border); }
    .trn-select {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.5px;
      max-width: 280px;
      outline: none;
      cursor: pointer;
      border-radius: 0;
      width: 100%;
    }
    .trn-select:focus { outline: 2px solid var(--lime); outline-offset: 2px; }

    /* ===== TOURNAMENT HERO ===== */
    .trn-hero {
      padding: 32px 0 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .trn-hero-left {}
    .trn-kicker {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .trn-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px, 6vw, 72px);
      line-height: 0.95;
      letter-spacing: 1px;
      color: var(--text);
    }
    .trn-meta {
      margin-top: 10px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .status-tag {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 3px 10px;
      border: 1.5px solid;
    }
    .status-tag.setup { border-color: var(--muted); color: var(--muted); }
    .status-tag.ongoing { background: var(--lime); border-color: var(--lime); color: var(--bg); }
    .status-tag.completed { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* ===== CHAMPION BANNER ===== */
    .champion-banner {
      background: var(--surface);
      color: var(--lime);
      padding: 20px 28px;
      margin: 24px 0;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .champion-trophy {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 3px;
      color: var(--lime);
      opacity: 0.8;
    }
    .champion-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 2px;
      line-height: 1;
    }

    /* ===== CLAIM BOX ===== */
    .claim-box {
      border: 1.5px solid var(--rule-strong);
      padding: 20px 24px;
      margin: 20px 0;
      background: var(--surface);
    }
    .claim-box.claimed { border-color: var(--border); border-left: 5px solid var(--lime); }
    .claim-box p { font-size: 14px; margin-bottom: 12px; }
    .claim-box strong { color: var(--text); font-weight: 700; }
    .claim-kicker {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .stack-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .stack-row select {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      min-width: 180px;
      outline: none;
      cursor: pointer;
      border-radius: 0;
    }
    .stack-row select:focus { outline: 2px solid var(--lime); }
    .self-report { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-strong); }
    .self-report p { margin-bottom: 10px; font-size: 14px; }
    .self-report-btns { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ===== PODIUM (Top 3) ===== */
    .podium-kicker {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-top: 28px;
      margin-bottom: 12px;
    }
    .podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .podium-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 120px;
    }
    .podium-medal { font-size: 28px; line-height: 1; }
    .podium-name {
      font-weight: 700;
      font-size: 14px;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .podium-score { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
    .podium-block {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      border-radius: 4px 4px 0 0;
      color: var(--bg);
    }
    .podium-step.rank-1 .podium-block { height: 90px; background: var(--lime); }
    .podium-step.rank-2 .podium-block { height: 64px; background: #c9d3da; }
    .podium-step.rank-3 .podium-block { height: 48px; background: #d9a066; }

    /* ===== PAGE GRID ===== */
    .page-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-top: 0;
      border-top: 1px solid var(--border);
    }

    .grid-col {
      padding: 24px 0;
    }
    .grid-col + .grid-col {
      padding-left: 28px;
      border-left: 1px solid var(--border);
    }
    .grid-col-full {
      grid-column: 1 / -1;
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
      min-width: 0;
    }

    /* ===== SECTION HEADERS ===== */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--text);
    }
    .section-count {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* ===== LEADERBOARD ===== */
    .leaderboard {
      list-style: none;
    }
    .leaderboard li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      font-weight: 500;
    }
    .leaderboard li:last-child { border: none; }
    .leaderboard li.top1 { background: var(--lime); margin: 0 -8px; padding: 10px 8px; }
    .lb-rank {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--muted);
      width: 28px;
      text-align: center;
      line-height: 1;
    }
    .leaderboard li.top1 .lb-rank { color: var(--bg); }
    .lb-name { flex: 1; font-weight: 500; }
    .lb-score {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .lb-score .w { color: var(--green); font-weight: 700; }
    .leaderboard li.top1 .lb-score { color: var(--bg); }
    .leaderboard li.top1 .lb-score .w { color: var(--bg); }

    /* ===== TEAM LIST ===== */
    .team-list { list-style: none; }
    .team-list li {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .team-list li:last-child { border: none; }
    .t-name { font-size: 15px; font-weight: 600; color: var(--text); }

    /* ===== BRACKET TREE (two sides converging on a center Final) ===== */
    .bracket-tree {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      padding: 12px 4px 24px;
      min-width: 0;
    }
    .bracket-tree .bracket-col-wrap,
    .bracket-tree .bracket-final-wrap { scroll-snap-align: center; }
    .scroll-hint {
      display: none;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: -8px;
      margin-bottom: 8px;
    }
    .bracket-arm {
      display: flex;
      align-items: stretch;
      gap: 40px;
    }
    .bracket-col-wrap {
      display: flex;
      flex-direction: column;
      min-width: 150px;
    }
    .bracket-rcol {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      gap: 14px;
      flex: 1;
    }
    .bracket-rcol .match { position: relative; margin-bottom: 0; }
    .bracket-arm.left .bracket-rcol .match::after {
      content: '';
      position: absolute;
      top: 50%;
      right: -20px;
      width: 20px;
      height: 1px;
      background: var(--rule-strong);
    }
    .bracket-arm.right .bracket-rcol .match::before {
      content: '';
      position: absolute;
      top: 50%;
      left: -20px;
      width: 20px;
      height: 1px;
      background: var(--rule-strong);
    }
    .bracket-final-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 40px;
      min-width: 160px;
    }
    .bracket-trophy { font-size: 30px; line-height: 1; }
    .bracket-final-label {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 3px;
      color: var(--muted);
      font-size: 12px;
    }
    .bracket-final-wrap .match { width: 100%; }
    .third-place-box {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed var(--rule-strong);
      width: 100%;
    }
    .third-place-box .round-label { font-size: 11px; }
    .third-place-box .match { border-left-color: #d9a066; }
    .third-place-box .match-row.winner { background: #d9a066; }
    .round-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .match {
      background: var(--surface);
      border-left: 3px solid var(--rule-strong);
      margin-bottom: 10px;
      min-height: 60px;
    }
    .match-row {
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }
    .match-row:last-child { border: none; }
    .match-row.winner {
      color: var(--bg);
      font-weight: 700;
      background: var(--lime);
      border-left: none;
    }
    .match-row.loser { color: var(--muted); }
    .match-row.muted-row { color: var(--muted); font-style: italic; font-size: 12px; padding: 10px; }
    .match-row small { color: var(--muted); font-size: 10px; }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      padding: 40px 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-family: 'DM Mono', monospace;
    }

    /* ===== FOOTER RULE ===== */
    .footer-bar {
      margin-top: 48px;
      border-top: 3px solid var(--border);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      color: var(--text);
    }
    .footer-note {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      .topbar { flex-wrap: wrap; gap: 12px; border-bottom: 3px solid var(--border); }
      .top-actions { border-left: none; padding-left: 0; }
      .page-grid { grid-template-columns: 1fr; }
      .grid-col + .grid-col { padding-left: 0; border-left: none; border-top: 1px solid var(--border); padding-top: 24px; }
      .bracket-arm { gap: 24px; }
      .bracket-rcol { min-width: 130px; }
      .bracket-final-wrap { padding: 0 20px; }
      .scroll-hint { display: block; }
      .stack-row { flex-direction: column; align-items: stretch; }
      .stack-row select { width: 100%; }
      .self-report-btns { flex-direction: column; }
      .self-report-btns .btn { text-align: center; justify-content: center; }
      .trn-hero { flex-direction: column; align-items: flex-start; }
      /* Touch targets: desktop's compact editorial sizing is too small to
         tap reliably on a phone, and inputs under 16px trigger iOS Safari's
         auto-zoom-on-focus. */
      .btn { min-height: 40px; padding: 10px 16px; }
      .btn.small { min-height: 38px; padding: 8px 14px; }
      .btn.xsmall { min-height: 32px; padding: 6px 12px; }
      input, select { font-size: 16px; min-height: 42px; }
      .self-report-btns .btn { min-height: 50px; font-size: 13px; }
      .match-row { min-height: 38px; display: flex; align-items: center; }
    }
    @media (max-width: 420px) {
      #app { padding: 0 14px 50px; }
    }
  </style>
</head>

  <div id="app"></div>

  <script>
    // ===== FIREBASE SETUP =====
    // Paste the EXACT SAME firebaseConfig used in admin.html here so both
    // pages read/write the same database. See admin.html / README.md for
    // setup steps.
    const firebaseConfig = {
      apiKey: "AIzaSyDUmbqZVLXdd5TluGZ9Dpib99UB4pihnoQ",
      authDomain: "tournament-2412.firebaseapp.com",
      databaseURL: "https://tournament-2412-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tournament-2412"
    };
    const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "PASTE_YOUR_API_KEY";
    let dataRef = null;
    if (FIREBASE_CONFIGURED) {
      firebase.initializeApp(firebaseConfig);
      dataRef = firebase.database().ref('vulsanx_data');
    }
    let firebaseFirstLoad = true;
    // Local writes echo back through the same listener once Firebase confirms
    // them. Re-rendering immediately on that echo would interrupt whatever
    // the player is doing (e.g. a half-filled claim form), so we briefly
    // hold off right after our own writes. The render is *deferred*, not
    // skipped, so an update that arrives during that window still shows up
    // as soon as the window ends, instead of getting silently lost until
    // some other change happens to come along.
    let suppressRenderUntil = 0;
    let pendingRenderTimer = null;

    function scheduleRender(renderFn) {
      clearTimeout(pendingRenderTimer);
      const wait = Math.max(0, suppressRenderUntil - Date.now());
      pendingRenderTimer = setTimeout(() => attemptRender(renderFn), wait);
    }
    // Even after the suppression window passes, don't blow away the DOM
    // while the player is actively focused in a field (e.g. mid-pick on the
    // claim dropdown right as an external/echoed update arrives) — wait
    // until they're not, then render.
    function attemptRender(renderFn) {
      const active = document.activeElement;
      const isTyping = active && ['INPUT', 'SELECT', 'TEXTAREA'].includes(active.tagName);
      if (isTyping) {
        pendingRenderTimer = setTimeout(() => attemptRender(renderFn), 400);
      } else {
        renderFn();
      }
    }

    // Firebase Realtime Database silently drops any key whose value is null,
    // [] or {} when it stores data (and an array with gaps comes back as an
    // object instead of an array). That means fields like `teams: []` or
    // `bracket: null` vanish entirely on write and read back as `undefined`.
    // Re-fill the expected shape every time we get a snapshot so the rest of
    // the app can keep assuming arrays/objects are always there.
    function normalizeData(raw) {
      const d = raw || {};
      return {
        tournaments: toArray(d.tournaments).map(normalizeTournament),
        activeTournamentId: d.activeTournamentId || null,
        claims: d.claims || {}
      };
    }
    function normalizeTournament(t) {
      return Object.assign({}, t, {
        teams: toArray(t.teams),
        bracket: t.bracket ? normalizeBracket(t.bracket) : null,
        champion: t.champion || null,
        thirdPlaceWinner: t.thirdPlaceWinner || null
      });
    }
    function normalizeBracket(b) {
      return Object.assign({}, b, {
        rounds: toArray(b.rounds).map(r => Object.assign({}, r, { matches: toArray(r.matches) }))
      });
    }
    function toArray(v) {
      if (Array.isArray(v)) return v;
      if (v && typeof v === 'object') return Object.values(v);
      return [];
    }

    function startRealtimeSync() {
      return new Promise((resolve) => {
        if (!dataRef) {
          resolve({ tournaments: [], activeTournamentId: null, claims: {} });
          return;
        }
        dataRef.on('value', (snapshot) => {
          const val = snapshot.val();
          data = normalizeData(val);
          if (firebaseFirstLoad) {
            firebaseFirstLoad = false;
            resolve(data);
          } else {
            scheduleRender(render);
          }
        });
      });
    }

    let data = null;
    let selectedTournamentId = null;
    const root = document.getElementById('app');

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    async function init() {
      if (!FIREBASE_CONFIGURED) {
        root.innerHTML = `
          <div class="empty-state" style="padding:80px 24px;text-align:center;">
            <div style="font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;opacity:0.3;margin-bottom:12px;">SETUP REQUIRED</div>
            <p>Firebase is not configured yet. Ask the superadmin to finish setup (see README.md).</p>
          </div>`;
        return;
      }
      data = await startRealtimeSync();
      selectedTournamentId = data.activeTournamentId;
      render();
    }

    function teamName(t, teamId) {
      if (!teamId) return '-';
      const team = t.teams.find(x => x.id === teamId);
      return team ? team.name : '?';
    }

    function render() {
      const tournament = selectedTournamentId ? getTournament(data, selectedTournamentId) : null;

      root.innerHTML = `
        <header class="topbar" style="padding:0;">
          <div class="brand-block">
            <div class="brand-eyebrow">Badminton Tournament</div>
            <div class="brand-name">vulsan<span class="accent">X</span></div>
          </div>
          <div class="top-actions">
            <a href="admin.html" class="btn small ghost">Admin ↗</a>
          </div>
        </header>

        <main>
          ${data.tournaments.length > 1 ? `
            <div class="trn-select-wrap">
              <select id="trnSelect" class="trn-select">
                ${data.tournaments.map(t => `<option value="${t.id}" ${t.id === selectedTournamentId ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}
              </select>
            </div>` : ''}

          ${tournament ? renderTournament(tournament) : `
            <div class="empty-state" style="padding:80px 0;">
              <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:2px;opacity:0.2;margin-bottom:12px;">NO TOURNAMENTS</div>
              <p>Waiting for the superadmin to set up.</p>
            </div>`}
        </main>

        <div class="footer-bar">
          <div class="footer-brand">VULSANX</div>
          <div class="footer-note">CYBER SMASH TOURNAMENT SYSTEM</div>
        </div>
      `;

      bindEvents(tournament);
    }

    function renderTournament(t) {
      const statusLabels = { setup: 'Not Started', ongoing: 'Live', completed: 'Final' };
      const statusClass = t.status || 'setup';

      return `
        <div class="trn-hero">
          <div class="trn-hero-left">
            <div class="trn-kicker">Tournament</div>
            <h1 class="trn-title">${esc(t.name)}</h1>
            <div class="trn-meta">
              <span class="status-tag ${statusClass}">${statusLabels[t.status] || t.status}</span>
            </div>
          </div>
        </div>

        ${t.status === 'completed' && t.champion ? `
          <div class="champion-banner">
            <div class="champion-trophy">Champion</div>
            <div class="champion-name">${esc(teamName(t, t.champion))}</div>
          </div>` : ''}

        ${renderClaimBox(t)}

        ${renderPodium(t)}

        <div class="page-grid">
          ${t.bracket ? `
            <div class="grid-col-full">
              <div class="section-head">
                <span class="section-label">Bracket</span>
              </div>
              ${renderBracket(t)}
            </div>` : `
            <div class="grid-col-full">
              <div class="section-head"><span class="section-label">Bracket</span></div>
              <div class="empty-state" style="padding:24px 0;text-align:left;">Bracket has not been generated by the superadmin yet.</div>
            </div>`}

          <div class="grid-col">
            <div class="section-head">
              <span class="section-label">Leaderboard</span>
            </div>
            <ol class="leaderboard">
              ${getLeaderboard(t).map((team, i) => `
                <li class="${i === 0 ? 'top1' : ''}">
                  <span class="lb-rank">${i + 1}</span>
                  <span class="lb-name">${esc(team.name)}</span>
                  <span class="lb-score"><span class="w">${team.wins}W</span> ${team.losses}L</span>
                </li>`).join('') || '<li style="color:var(--muted);padding:10px 0;font-size:13px;font-family:DM Mono,monospace;">No data yet.</li>'}
            </ol>
          </div>

          <div class="grid-col">
            <div class="section-head">
              <span class="section-label">Teams</span>
              <span class="section-count">${t.teams.length} Registered</span>
            </div>
            <ul class="team-list">
              ${t.teams.map(team => `
                <li>
                  <span class="t-name">${esc(team.name)}</span>
                </li>`).join('') || '<li style="color:var(--muted);padding:10px 0;font-size:13px;">No teams yet.</li>'}
            </ul>
          </div>
        </div>
      `;
    }

    function renderPodium(t) {
      let top3 = getLeaderboard(t).slice(0, 3);
      const tp = getThirdPlaceMatch(t);
      if (tp && tp.winner) {
        const thirdTeam = t.teams.find(team => team.id === tp.winner);
        if (thirdTeam) top3 = [top3[0], top3[1], thirdTeam].filter(Boolean);
      }
      if (!top3.length) return '';
      const medals = ['🥇', '🥈', '🥉'];
      const order = [1, 0, 2]; // display order: 2nd, 1st, 3rd (classic podium)
      return `
        <div class="podium-kicker">Top Teams</div>
        <div class="podium">
          ${order.filter(i => top3[i]).map(i => `
            <div class="podium-step rank-${i + 1}">
              <div class="podium-medal">${medals[i]}</div>
              <div class="podium-name">${esc(top3[i].name)}</div>
              <div class="podium-score">${top3[i].wins}W ${top3[i].losses}L</div>
              <div class="podium-block">${i + 1}</div>
            </div>`).join('')}
        </div>`;
    }

    function renderClaimBox(t) {
      const claimedTeamId = getClaim(data, t.id);

      if (claimedTeamId) {
        const team = t.teams.find(x => x.id === claimedTeamId);
        if (!team) {
          clearClaim(data, t.id);
        } else {
          const liveMatch = findLiveMatchForTeam(t, claimedTeamId);
          return `
            <div class="claim-box claimed">
              <div class="claim-kicker">Device Registered As</div>
              <p>Team: <strong>${esc(team.name)}</strong></p>
              ${liveMatch ? renderSelfReport(t, liveMatch, claimedTeamId) : '<p style="color:var(--muted);font-size:13px;font-family:DM Mono,monospace;">No active match for your team right now.</p>'}
              <button id="unclaimBtn" class="btn xsmall ghost" style="margin-top:14px;">Not your team? Reset →</button>
            </div>`;
        }
      }

      if (!t.teams.length) return '';

      return `
        <div class="claim-box">
          <div class="claim-kicker">Register This Device</div>
          <p>Choose your team for this device (one-time registration to report wins/losses):</p>
          <form id="claimForm" class="stack-row">
            <select id="claimTeamSelect">
              ${t.teams.map(team => `<option value="${team.id}">${esc(team.name)}</option>`).join('')}
            </select>
            <button type="submit" class="btn primary small">Confirm →</button>
          </form>
        </div>`;
    }

    function findLiveMatchForTeam(t, teamId) {
      if (t.bracket) {
        for (let rIdx = 0; rIdx < t.bracket.rounds.length; rIdx++) {
          const matches = t.bracket.rounds[rIdx].matches;
          for (let mIdx = 0; mIdx < matches.length; mIdx++) {
            const m = matches[mIdx];
            if (m.status === 'ready' && (m.teamA === teamId || m.teamB === teamId)) {
              return { rIdx, mIdx, match: m };
            }
          }
        }
      }
      const tp = getThirdPlaceMatch(t);
      if (tp && tp.status === 'ready' && (tp.teamA === teamId || tp.teamB === teamId)) {
        return { rIdx: '3rd', mIdx: 0, match: tp };
      }
      return null;
    }

    // The two semifinal losers play each other for 3rd place. This match is
    // derived on the fly from the semifinal results (not part of the win
    // bracket itself) and only exists once both semifinals are decided.
    function getThirdPlaceMatch(t) {
      if (!t.bracket || t.bracket.rounds.length < 2) return null;
      const semiRound = t.bracket.rounds[t.bracket.rounds.length - 2];
      if (semiRound.matches.length !== 2) return null;
      const [m1, m2] = semiRound.matches;
      if (m1.status !== 'done' || m2.status !== 'done') return null;
      const loser1 = m1.teamA === m1.winner ? m1.teamB : m1.teamA;
      const loser2 = m2.teamA === m2.winner ? m2.teamB : m2.teamA;
      const winner = (t.thirdPlaceWinner === loser1 || t.thirdPlaceWinner === loser2) ? t.thirdPlaceWinner : null;
      return { teamA: loser1, teamB: loser2, winner, status: winner ? 'done' : 'ready' };
    }

    function setThirdPlaceWinner(tournament, winnerId) {
      const tp = getThirdPlaceMatch(tournament);
      if (!tp || (winnerId !== tp.teamA && winnerId !== tp.teamB)) return;
      tournament.thirdPlaceWinner = winnerId;
    }

    function renderSelfReport(t, live, teamId) {
      const opponentId = live.match.teamA === teamId ? live.match.teamB : live.match.teamA;
      return `
        <div class="self-report">
          <p>Your match is now against <strong>${esc(teamName(t, opponentId))}</strong>:</p>
          <div class="self-report-btns">
            <button class="btn primary" data-report="${live.rIdx}:${live.mIdx}:${teamId}">We Won →</button>
            <button class="btn danger" data-report="${live.rIdx}:${live.mIdx}:${opponentId}">We Lost</button>
          </div>
        </div>`;
    }

    // Splits every round except the final into a left half and a right half
    // of matches, so the bracket can be drawn as two sides converging on a
    // single Final column in the middle (like a classic tournament chart),
    // instead of one flat left-to-right list of rounds.
    function buildBracketSides(bracket) {
      const rounds = bracket.rounds;
      const lastIdx = rounds.length - 1;
      const leftCols = [];
      const rightCols = [];
      for (let r = 0; r < lastIdx; r++) {
        const matches = rounds[r].matches;
        const half = matches.length / 2;
        leftCols.push({ rIdx: r, matches: matches.slice(0, half) });
        rightCols.push({ rIdx: r, matches: matches.slice(half) });
      }
      rightCols.reverse(); // deepest (closest to Final) first, Round 1 last
      return { leftCols, rightCols, finalMatch: rounds[lastIdx].matches[0], totalRounds: rounds.length };
    }

    function renderBracket(t) {
      const { leftCols, rightCols, finalMatch, totalRounds } = buildBracketSides(t.bracket);
      const thirdPlace = getThirdPlaceMatch(t);
      const renderArm = (cols, side) => cols.length ? `
        <div class="bracket-arm ${side}">
          ${cols.map(col => `
            <div class="bracket-col-wrap">
              <div class="round-label">${roundLabel(col.rIdx, totalRounds)}</div>
              <div class="bracket-rcol">
                ${col.matches.map(m => renderMatchView(t, m)).join('')}
              </div>
            </div>`).join('')}
        </div>` : '';
      return `
        <div class="scroll-hint">← Swipe to see full bracket →</div>
        <div class="bracket-tree">
          ${renderArm(leftCols, 'left')}
          <div class="bracket-final-wrap">
            <div class="bracket-trophy">🏆</div>
            <div class="round-label">${roundLabel(totalRounds - 1, totalRounds)}</div>
            ${renderMatchView(t, finalMatch)}
            ${thirdPlace ? `
              <div class="third-place-box">
                <div class="round-label">🥉 3rd Place</div>
                ${renderMatchView(t, thirdPlace)}
              </div>` : ''}
          </div>
          ${renderArm(rightCols, 'right')}
        </div>`;
    }

    function renderMatchView(t, m) {
      const aName = teamName(t, m.teamA);
      const bName = teamName(t, m.teamB);
      if (m.status === 'bye') {
        return `<div class="match"><div class="match-row winner">${esc(m.teamA ? aName : bName)} <small>(bye)</small></div></div>`;
      }
      if (m.status === 'pending') {
        return `<div class="match"><div class="match-row muted-row">Waiting...</div></div>`;
      }
      if (m.status === 'ready') {
        return `<div class="match"><div class="match-row">${esc(aName)}</div><div class="match-row">${esc(bName)}</div></div>`;
      }
      return `<div class="match">
        <div class="match-row ${m.winner === m.teamA ? 'winner' : 'loser'}">${esc(aName)}</div>
        <div class="match-row ${m.winner === m.teamB ? 'winner' : 'loser'}">${esc(bName)}</div>
      </div>`;
    }

    function bindEvents(tournament) {
      const trnSelect = document.getElementById('trnSelect');
      if (trnSelect) trnSelect.addEventListener('change', () => {
        selectedTournamentId = trnSelect.value;
        render();
      });

      const claimForm = document.getElementById('claimForm');
      if (claimForm) claimForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const teamId = document.getElementById('claimTeamSelect').value;
        setClaim(data, tournament.id, teamId);
        render();
      });

      const unclaimBtn = document.getElementById('unclaimBtn');
      if (unclaimBtn) unclaimBtn.addEventListener('click', () => {
        if (!confirm('Reset team registration for this device?')) return;
        clearClaim(data, tournament.id);
        render();
      });

      document.querySelectorAll('[data-report]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [rIdx, mIdx, winnerId] = btn.dataset.report.split(':');
          const t = getTournament(data, tournament.id);
          if (rIdx === '3rd') {
            setThirdPlaceWinner(t, winnerId);
          } else {
            setMatchWinner(t, Number(rIdx), Number(mIdx), winnerId);
          }
          saveData(data);
          render();
        });
      });
    }

    function getTournament(data, id) { return data.tournaments.find(t => t.id === id) || null; }
    function getDeviceId() {
      let id = localStorage.getItem('vulsanx_device_id');
      if (!id) {
        id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('vulsanx_device_id', id);
      }
      return id;
    }
    function getClaim(data, tournamentId) {
      const deviceId = getDeviceId();
      return (data.claims[tournamentId] || {})[deviceId] || null;
    }
    function setClaim(data, tournamentId, teamId) {
      const deviceId = getDeviceId();
      if (!data.claims[tournamentId]) data.claims[tournamentId] = {};
      data.claims[tournamentId][deviceId] = teamId;
      saveData(data);
    }
    function clearClaim(data, tournamentId) {
      const deviceId = getDeviceId();
      if (data.claims[tournamentId]) delete data.claims[tournamentId][deviceId];
      saveData(data);
    }
    function saveData(data) {
      suppressRenderUntil = Date.now() + 1200;
      if (dataRef) dataRef.set(data);
    }
    function getLeaderboard(tournament) {
      return tournament.teams.slice().sort((a, b) => {
        if (b.wins !== a.wins) return b.wins - a.wins;
        return a.losses - b.losses;
      });
    }
    function roundLabel(roundIndex, totalRounds) {
      const fromEnd = totalRounds - roundIndex;
      if (fromEnd === 1) return 'Final';
      if (fromEnd === 2) return 'Semifinal';
      if (fromEnd === 3) return 'Quarterfinal';
      return 'Round ' + (roundIndex + 1);
    }
    function setMatchWinner(tournament, roundIndex, matchIndex, winnerId) {
      const match = tournament.bracket.rounds[roundIndex].matches[matchIndex];
      if (!match.teamA || !match.teamB) return;
      if (winnerId !== match.teamA && winnerId !== match.teamB) return;
      match.winner = winnerId;
      match.status = 'done';
      const winner = tournament.teams.find(t => t.id === winnerId);
      const loserId = match.teamA === winnerId ? match.teamB : match.teamA;
      const loser = tournament.teams.find(t => t.id === loserId);
      if (winner) winner.wins += 1;
      if (loser) loser.losses += 1;
      const nextRoundIndex = roundIndex + 1;
      if (nextRoundIndex < tournament.bracket.rounds.length) {
        const nextMatch = tournament.bracket.rounds[nextRoundIndex].matches[Math.floor(matchIndex / 2)];
        if (matchIndex % 2 === 0) nextMatch.teamA = winnerId;
        else nextMatch.teamB = winnerId;
        if (nextMatch.teamA && nextMatch.teamB) nextMatch.status = 'ready';
        else nextMatch.status = 'pending';
      }
      if (roundIndex === tournament.bracket.rounds.length - 1) {
        tournament.status = 'completed';
        tournament.champion = winnerId;
      }
      saveData(data);
    }

    init();
  </script>
</body>
</html>
